name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: grades_app_test
          POSTGRES_USER: grades_user
          POSTGRES_PASSWORD: grades_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U grades_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: grades_app_test
      DJANGO_DB_USER: grades_user
      DJANGO_DB_PASSWORD: grades_pass
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: 5432
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=grades_app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Bandit scan
        run: |
          bandit -r grades_app -lll -c .bandit.yml
